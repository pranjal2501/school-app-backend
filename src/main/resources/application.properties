jwt.expiration=86400000

# --- LOGGING CONFIGURATION ---

# General application logging level (INFO is default, DEBUG gives more detail)
logging.level.root=INFO

# Detailed Spring Security logs (Crucial for debugging JWT, Filters, and Access Denied errors)
logging.level.org.springframework.security=TRACE

# Detailed Web/HTTP logs (Shows incoming requests, headers, and routing)
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Hibernate/Database logging (Trace shows the actual values bound to SQL queries)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Your specific application logs (Replace with your base package if needed)
logging.level.com.example.school_management=DEBUG

# Show the stack trace in the browser/API response for debugging (Disable in production)
server.error.include-stacktrace=always
server.error.include-message=always

